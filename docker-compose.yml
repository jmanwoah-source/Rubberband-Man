version: '3.8'

services:
  rubberbandman:
    build: .
    container_name: rubberband_man_terminal
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      # Allows the container to access host services like Ollama on http://host.docker.internal:11434
      - "host.docker.internal:host-gateway"
