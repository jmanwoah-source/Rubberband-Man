services:
  rubberband_api:
    build: .
    container_name: rubberband_api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
    volumes:
      - ./data:/app/data
      - ./intel_bus:/app/intel_bus
    extra_hosts:
      # Allows reaching host LLM services (e.g., Ollama on http://host.docker.internal:11434/v1)
      - "host.docker.internal:host-gateway"

  rubberband_daemon:
    build: .
    container_name: rubberband_daemon
    restart: unless-stopped
    command:
      - python
      - daily_tracker_daemon.py
      - --daemon
      - --interval
      - "1800"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./intel_bus:/app/intel_bus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; p='/app/data/.daemon_heartbeat'; sys.exit(0 if os.path.exists(p) and (time.time() - os.path.getmtime(p)) < 3600 else 1)"
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3

  rubberband_streamlit:
    profiles:
      - legacy
    build: .
    container_name: rubberband_streamlit
    restart: unless-stopped
    command:
      - python
      - -m
      - streamlit
      - run
      - rubberband.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./intel_bus:/app/intel_bus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8501/_stcore/health
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
